name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

# A new push on the same branch cancels the run that became obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a full commit SHA (immutable), the version is kept in a comment.
      # Dependabot updates both.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET (version from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          # NuGet packages cached, keyed on the lock files.
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Setup Node (version from the views project)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/Hestia.Room.Finance.Views/.nvmrc
          # npm packages cached, keyed on the lock file.
          cache: npm
          cache-dependency-path: src/Hestia.Room.Finance.Views/package-lock.json

      # The views (TypeScript, Vite): exact lock file, no install script (.npmrc), lint and tests before the .NET
      # build, which then builds and embeds them.
      - name: Install the views dependencies
        working-directory: src/Hestia.Room.Finance.Views
        run: npm ci --no-audit --no-fund

      - name: Lint the views
        working-directory: src/Hestia.Room.Finance.Views
        run: npm run lint

      - name: Test the views
        working-directory: src/Hestia.Room.Finance.Views
        run: npm test

      # --locked-mode: fails if a dependency differs from packages.lock.json (version or content hash).
      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build
