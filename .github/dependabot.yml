version: 2

updates:
  # NuGet packages of every project (globs: no need to list each project).
  - package-ecosystem: nuget
    directories:
      - /src/*
      - /tests/*
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
      timezone: Europe/Paris
    groups:
      # Minor and patch updates in a single PR; major updates stay separate (breaking changes).
      nuget-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  # npm packages of the MCP Apps views (exact versions in package.json and the lock file).
  - package-ecosystem: npm
    directory: /src/Hestia.Room.Finance.Views
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
      timezone: Europe/Paris
    # Supply chain: a new version is proposed only once it has been published for 7 days, so that a compromised
    # release has time to be detected and pulled before it reaches the repository.
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  # .NET SDK pinned in global.json. SDK releases mostly land on Patch Tuesday, hence Wednesday.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
      timezone: Europe/Paris
    commit-message:
      prefix: deps

  # Docker images of docker-compose.yml (the local SQL Server).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
      timezone: Europe/Paris
    commit-message:
      prefix: deps

  # GitHub Actions used by the workflows (updates the pinned SHA and its version comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
      timezone: Europe/Paris
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
