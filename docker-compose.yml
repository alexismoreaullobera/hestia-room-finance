# Local SQL Server for the Finance room (development only).
# Start: docker compose up -d   ·   Stop: docker compose down   ·   Reset the data: docker compose down -v
name: hestia-finance

services:
  sqlserver:
    # Pinned version (updated by Dependabot), never "latest".
    image: mcr.microsoft.com/mssql/server:2025-CU9-GDR1-ubuntu-24.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Read from the .env file next to this one (never committed, see .env.example).
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in a .env file, see .env.example}
    ports:
      # Bound to localhost only: the database is not reachable from the network.
      - "127.0.0.1:1433:1433"
    volumes:
      # Named volume: the data survives a restart of the container.
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # Password passed through SQLCMDPASSWORD, not -P: a command-line argument shows in the process list.
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$${MSSQL_SA_PASSWORD}\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  sqlserver-data:
