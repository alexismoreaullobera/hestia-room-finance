<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Soldes</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #656d76;
      --line: #d0d7de;
      --accent: #0969da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #8d96a0;
        --line: #30363d;
        --accent: #4493f8;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .total { font-size: 28px; font-weight: 600; color: var(--accent); margin: 2px 0 12px; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--line); }
    .amount { font-variant-numeric: tabular-nums; }
    .status { color: var(--muted); }
  </style>
</head>
<body>
  <div class="label">Solde total</div>
  <div class="total" id="total">…</div>
  <ul id="accounts"></ul>
  <p class="status" id="status">En attente des données…</p>

  <script type="module">
    // The ext-apps App SDK is loaded from unpkg: this domain is declared in the resource CSP (_meta.ui.csp.resourceDomains).
    import { App } from "https://unpkg.com/@modelcontextprotocol/ext-apps@2.0.3/app-with-deps";

    const euros = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" });
    const totalEl = document.getElementById("total");
    const accountsEl = document.getElementById("accounts");
    const statusEl = document.getElementById("status");

    function render(view) {
      totalEl.textContent = euros.format(view.total);
      accountsEl.replaceChildren(...view.accounts.map(account => {
        const li = document.createElement("li");
        const name = document.createElement("span");
        const amount = document.createElement("span");
        // textContent only (never innerHTML): data coming from tools is untrusted.
        name.textContent = account.name;
        amount.textContent = euros.format(account.balance);
        amount.className = "amount";
        li.append(name, amount);
        return li;
      }));
      statusEl.hidden = true;
    }

    const app = new App({ name: "Hestia Finance - Balance", version: "0.1.0" });

    // Handlers must be registered before connecting.
    app.ontoolresult = (result) => {
      const view = result.structuredContent;
      if (view?.accounts) {
        render(view);
      } else {
        statusEl.textContent = "Données indisponibles.";
      }
    };
    app.onerror = console.error;

    await app.connect();
  </script>
</body>
</html>
