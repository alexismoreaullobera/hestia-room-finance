<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Abonnements</title>
  <style>
    /* @shared view.css */
  </style>
</head>
<body>
  <header class="view-header">
    <button id="previous" type="button" aria-label="Mois précédent">‹</button>
    <h1><span class="label">Abonnements</span><span id="month">…</span></h1>
    <button id="next" type="button" aria-label="Mois suivant">›</button>
  </header>
  <p class="status" id="status">En attente des données…</p>
  <main id="content" hidden></main>

  <script type="module">
    /* @shared view.js */

    await startView({
      name: "Subscriptions",
      tool: "show_subscriptions",
      render: (data, content) => {
        content.append(element("p", { className: "muted", text: "Vue en construction." }));
      },
    });
  </script>
</body>
</html>
